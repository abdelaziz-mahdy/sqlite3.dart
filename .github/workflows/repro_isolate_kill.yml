name: Repro isolate kill crash

on:
  push:
    branches: [repro/windows-isolate-kill]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  variants:
    strategy:
      fail-fast: false
      matrix:
        variant: [pure, ffi_finalizer, exec, prepclose, prepleak, dbcycle]
        sqlite: [system-os-specific]
    name: windows / ${{ matrix.variant }}
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: dart-lang/setup-dart@v1
      with:
        sdk: stable
    - run: dart pub get
    - name: Use system SQLite
      run: dart run tool/hook_overrides.dart ${{ matrix.sqlite }}
    - name: Kill loop, 6 runs of 5000 kills
      shell: bash
      working-directory: sqlite3/
      run: |
        dart compile kernel tool/isolate_kill_repro.dart -o repro.dill 2>/dev/null || true
        crashes=0
        for i in $(seq 1 6); do
          if ! dart run tool/isolate_kill_repro.dart ${{ matrix.variant }} 5000 > run_$i.txt 2>&1; then
            crashes=$((crashes+1))
            echo "::warning::run $i crashed"
            grep -a -A8 "CRASH" run_$i.txt || tail -15 run_$i.txt
          else
            tail -1 run_$i.txt
          fi
        done
        echo "RESULT ${{ matrix.variant }}: $crashes of 6 runs crashed (30000 kills)"
