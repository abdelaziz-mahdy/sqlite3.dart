name: Repro isolate kill crash

on:
  push:
    branches: [repro/windows-isolate-kill]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-loop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        dart: [stable, dev]
    name: ${{ matrix.os }} / Dart ${{ matrix.dart }} / warmed-up test x120
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: dart-lang/setup-dart@v1
      with:
        sdk: ${{ matrix.dart }}
    - run: dart pub get
    - name: Use system SQLite
      run: dart run tool/hook_overrides.dart system-os-specific
    - name: Run the isolate kill test 120 times
      shell: bash
      working-directory: sqlite3/
      run: |
        fails=0
        for i in $(seq 1 120); do
          if ! dart test test/ffi/isolate_kill_test.dart > out_$i.txt 2>&1; then
            fails=$((fails+1))
            echo "::warning::run $i failed"
            grep -a -A10 "CRASH" out_$i.txt || tail -20 out_$i.txt
          fi
        done
        echo "RESULT ${{ matrix.os }}/${{ matrix.dart }}: $fails of 120 runs failed"
        test "$fails" = 0
